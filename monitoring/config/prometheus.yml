global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Tambahkan target perangkat melalui HTTP service discovery aplikasi atau
  # file_sd. Jangan menulis SNMP community langsung dalam repository ini.
  - job_name: snmp
    metrics_path: /snmp
    params:
      module: [if_mib]
    file_sd_configs:
      - files: [/etc/prometheus/targets/snmp/*.json]
        refresh_interval: 5m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116

